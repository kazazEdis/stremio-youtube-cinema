name: build-catalog

on:
  schedule:
    # Off-the-hour on purpose — GitHub queues cron heavily at :00.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  # Deploying the site as an artifact rather than serving /docs from the branch.
  # 20 regional trees are 66,000 files and 280 MB — committing that weekly would
  # bury the one commit that matters under a churn of identical stream files.
  pages: write
  id-token: write

concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 45 was enough before the regional trees. Publishing 21 of them adds about
    # seven minutes, and a cache miss puts the IMDb index build and a full
    # re-resolve in the same run.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, not 20: the pipeline is built on node:sqlite, which does not
          # exist before 22 and is only stable from 24. Pinned to what the
          # tests actually run against.
          node-version: '24'

      # The IMDb index is deliberately NOT cached.
      #
      # It was keyed on the dataset's last-modified header, which is correct but
      # useless here: IMDb republishes daily and this job runs weekly, so the key
      # always misses and the 1.6 GB entry expires unread before the next run.
      # Caching it would also be a wash on time -- compressing, uploading and
      # restoring 1.6 GB costs about what rebuilding costs on a runner, and CI
      # minutes are free on a public repo where correctness is not.
      #
      # Rebuilding every run also guarantees the index matches the dataset that
      # produced it, which is the property fct_resolution.dataset relies on to
      # decide whether a stored resolution is still valid.
      - name: Build IMDb index
        run: node src/resolve/build-index.js --cache .cache

      # Landing must survive between runs or every build re-extracts from
      # scratch. It holds the per-channel watermarks that make the extract
      # incremental -- measured at roughly 60x fewer quota units on a quiet
      # week. Rolling key: a new entry each run, restoring the most recent.
      - name: Cache warehouse
        uses: actions/cache@v4
        with:
          path: data
          key: dwh-${{ github.run_id }}
          restore-keys: dwh-

      - name: Extract to landing
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: npm run extract

      - name: Stage
        run: npm run stage

      - name: Transform to core
        run: npm run transform

      # Publishing runs the quality gates itself and exits non-zero without
      # writing anything if one fails, which is what the old jq sanity step did
      # by hand. A partial catalog from an exhausted quota looks valid, so the
      # check has to happen before any file is written, not after.
      - name: Publish marts
        run: npm run publish

      # What only a real client knows: age-gating, which the Data API reports as
      # embeddable; a video that is simply gone while videos.list still returns
      # its metadata; and the resolution shown to the viewer. Nothing else keeps
      # fct_playback current, and both the quarantine and the dead-upload rule
      # read it — without this a video that gets ungated stays quarantined for
      # good, and one that dies is never noticed.
      #
      # It reads the marts, so it has to come after publish; the second publish
      # below is what applies whatever it just learned, rather than leaving the
      # catalogue a week behind its own findings.
      #
      # 150 a run at ~3.6s each is about two minutes, and refreshes the whole
      # 3,893 streams roughly every six months while covering anything new
      # first. Raise --sample to go faster.
      #
      # A runner is a datacenter IP, so YouTube will bot-check it far more often
      # than a home connection does. That is survivable rather than fatal: a
      # throttled probe is classified apart and never written, so a blocked run
      # learns nothing instead of recording a healthy film as dead. The step is
      # continue-on-error for the same reason — it is diagnostic, and must not
      # throw away a catalogue that published cleanly.
      - name: Probe playback
        continue-on-error: true
        run: |
          # The documented install, unpinned on purpose: YouTube changes often
          # enough that a pinned yt-dlp is a broken one within months.
          sudo curl -sSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version
          npm run probe-playback -- --sample 150

      - name: Republish with what the probe found
        run: npm run publish

      # Asks YouTube whether the videos we just published still play — deleted,
      # private, un-embeddable or newly geo-blocked. The extract is incremental,
      # so a video pulled since it was last hydrated is invisible until someone
      # looks; this looks, for about 62 quota units against a 10,000/day budget.
      #
      # continue-on-error because it is diagnostic. A quota error or a network
      # blip here must not throw away a catalogue that published cleanly, and
      # the step reports rather than acting on what it finds.
      - name: Verify published streams
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: npm run verify-streams

      - name: Upload warehouse for inspection
        uses: actions/upload-artifact@v4
        with:
          name: warehouse
          path: data/warehouse.sqlite
          retention-days: 30

      # Only the unrestricted tree is committed; docs/region=*/ is gitignored.
      # The artifact carries everything, so the repo stays diffable while the
      # site serves all 21 addons.
      - name: Commit catalog
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "no changes"
          else
            COUNT=$(jq '.count' docs/catalog.json)
            git commit -m "catalog: ${COUNT} films [skip ci]"
            git push
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
